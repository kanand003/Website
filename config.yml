baseURL: "/"
defaultContentLanguage: en
languageCode: en
title: Anand Kumar
pagination:
  papersize: 10
theme: PaperMod
enableEmoji: true

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: UA-123-45

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: ExampleSite
  description: "ExampleSite description"
  keywords: [Blog, Portfolio, PaperMod]
  author: Me
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "<link / abs url>"
    favicon16x16: "<link / abs url>"
    favicon32x32: "<link / abs url>"
    apple_touch_icon: "<link / abs url>"
    safari_pinned_tab: "<link / abs url>"

  label:
    text: "Home"
    icon: /apple-touch-icon.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Anand Kumar
    subtitle: "Software Engineer | Game Programmer"
    buttons:
      - identifier: about
        name: About Me
        url: /Website/about
      - name: Projects
        url: /Website/projects

   # home-info mode
   # homeInfoParams:
   #  Title: "Hi there \U0001F44B"
   # Content: Welcome to my Website
  social:
    twitter: "And_K03"
    youtube: "anand003"
    github: "kanand003"
    strava: "100945115"
    email: "anand_kumar1999@hotmail.com"

  socialLinks:
    github:
      url: "https://github.com/%s"
      text: "Follow on GitHub"
    twitter:
      url: "https://twitter.com/%s"
      text: "Follow on Twitter"
    youtube:
      url: "https://www.youtube.com/@%s"
      text: "Subscribe on YouTube"
    strava:
      url: "https://www.strava.com/athletes/%s"
      text: "Follow on Strava"
    email:
      url: "mailto:%s?subject=Hi Anand"
      text: "Send an email"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: about
      name: About Me
      url: "/about"
      weight: 1
    - identifier: posts
      name: Posts
      url: "/post"
      weight: 2
    - identifier: projects
      name: Projects
      url: "/projects"
      weight: 3  
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai