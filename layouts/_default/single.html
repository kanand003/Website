{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">
      {{- if .Date }}
      <span class="post-date">{{- .Date.Format "January 2, 2006" -}}</span>
      {{- end }}
    </div>
  </header>
  {{ .Content }}
</article>
{{ end }}
